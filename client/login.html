<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | DMS Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css" />
    <script defer src="/dashboard/assets/login.js"></script>
  </head>
  <body>
    <main class="auth-screen">
      <section class="auth-panel">
        <p class="eyebrow">Email tracking</p>
        <h1>DMS Dashboard</h1>
        <form id="login-form" class="auth-form">
          <label for="login-email">Email</label>
          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="username"
            value=""
            required
          />
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button type="submit">Sign in</button>
        </form>
        <form id="password-form" class="auth-form hidden">
          <p class="muted">Set a new password to continue.</p>
          <label for="new-password">New password</label>
          <input
            id="new-password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
          />
          <button type="submit">Update password</button>
        </form>
        <p
          id="auth-status"
          class="auth-status"
          role="status"
          aria-live="polite"
        ></p>
      </section>
    </main>
  </body>
</html>
