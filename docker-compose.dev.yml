services:
  dashboard:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    env_file:
      - example.env
    environment:
      - DATABASE_PATH=/data/tracker.sqlite
      - SEED_FAKE_USER=true
      - TRACKING_BASE_URL=localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./dms-root/dev-data:/data
      - ./dms-root:/dms
    command: pnpm run dev:container
